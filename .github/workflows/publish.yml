name: Publish

on:
  push:
    tags: ['v*']
  # Manual re-run after adding the NPM_TOKEN secret: Actions → Publish →
  # Run workflow, no new tag required.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tag pushes do not trigger verify.yml (it runs on main pushes and PRs),
  # so the release tag used to bypass the 25-check skill-pack verification.
  # Replicate the verify job here and gate publishing on it.
  verify:
    name: skill pack verification (25 checks) before publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout skill pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout deepseek-harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          # Pinned for reproducible verification; bump in the same PR as any
          # peer-dependency change (mirrors verify.yml).
          ref: 141eb6fef83422698aef7a981029e843e8161534
          path: harness

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install harness workspace
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: Run skill pack verification
        working-directory: harness
        env:
          DSH_HARNESS_CHECKOUT: ${{ github.workspace }}/harness
        run: pnpm exec tsx "${{ github.workspace }}/verify/verify-skill-pack.mts"

  publish-provider:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skill pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: provider/pnpm-lock.yaml

      - name: Verify the tag matches the VERSION file (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${tag}"
            exit 1
          fi

      - name: Install provider (standalone)
        working-directory: provider
        run: pnpm install --frozen-lockfile

      - name: Build provider
        working-directory: provider
        run: pnpm run build

      # npm publish runs the provider's prepack (skills copy into pack/).
      # Requires the NPM_TOKEN repository secret; a tag push without the
      # secret, or for a version already on the registry, skips the publish
      # instead of failing the release tag.
      - name: Publish provider to npm
        working-directory: provider
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set; skipping npm publish"
            exit 0
          fi
          if npm view "@perrylink/dsh-skill-pack-security-provider@${version}" version >/dev/null 2>&1; then
            echo "@perrylink/dsh-skill-pack-security-provider@${version} is already published; skipping npm publish"
          else
            npm publish --access public
          fi

  release:
    needs: publish-provider
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout skill pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
