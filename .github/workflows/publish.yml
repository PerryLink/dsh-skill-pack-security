name: Publish

on:
  push:
    tags: ['v*']
  # Manual re-run: Actions → Publish → Run workflow, no new tag required.
  # Authentication is OIDC trusted publishing; there is no NPM_TOKEN secret.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Tag pushes do not trigger verify.yml (it runs on main pushes and PRs),
  # so the release tag used to bypass the 25-check skill-pack verification.
  # Replicate the verify job here and gate publishing on it.
  verify:
    name: skill pack verification (25 checks) before publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout skill pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout deepseek-harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          # Pinned for reproducible verification; bump in the same PR as any
          # peer-dependency change (mirrors verify.yml).
          ref: d347e703908d0406b7a7ef80e3a0e594d86b2215
          path: harness

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install harness workspace
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: Run skill pack verification
        working-directory: harness
        env:
          DSH_HARNESS_CHECKOUT: ${{ github.workspace }}/harness
        run: pnpm exec tsx "${{ github.workspace }}/verify/verify-skill-pack.mts"

  publish-provider:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout skill pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          # No registry-url on purpose: it writes an empty `_authToken` line into
          # .npmrc, and the registry then answers 404 on PUT instead of letting npm
          # perform the OIDC exchange. See the publish step below.
          cache: pnpm
          cache-dependency-path: provider/pnpm-lock.yaml

      - name: Verify the tag matches the VERSION file (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${tag}"
            exit 1
          fi

      - name: Install provider (standalone)
        working-directory: provider
        run: pnpm install --frozen-lockfile

      - name: Build provider
        working-directory: provider
        run: pnpm run build

      # npm publish runs the provider's prepack (skills copy into pack/).
      # Authentication is OIDC trusted publishing, matching the sibling
      # dsh-permission-rules and jevcore release workflows: no long-lived
      # NPM_TOKEN is stored, and `id-token: write` above is what lets npm mint
      # and exchange the runner's OIDC token. The v2.2.18/v2.2.19 releases failed
      # because the retired token path was still in place (409 staged version,
      # then 404 on PUT). A version already on the registry still skips, so
      # re-runs stay idempotent.
      - name: Upgrade npm so it can perform the OIDC exchange
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request token: present"
          else
            echo "::error::OIDC request token is MISSING; trusted publishing cannot work"
            exit 1
          fi
          if [ -f "$HOME/.npmrc" ]; then echo "--- $HOME/.npmrc ---"; cat "$HOME/.npmrc"; else echo "no $HOME/.npmrc"; fi

      - name: Publish provider to npm
        working-directory: provider
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@perrylink/dsh-skill-pack-security-provider@${version}" version >/dev/null 2>&1; then
            echo "@perrylink/dsh-skill-pack-security-provider@${version} is already published; skipping npm publish"
          else
            npm publish --access public --provenance
          fi

      # Advisory only: npm's read side can lag minutes behind a successful publish, and a hard
      # failure here skipped the GitHub Release (observed on dsh-cert-mcp v0.2.1).
      - name: Verify the version is live on the registry (advisory)
        shell: bash
        working-directory: provider
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 12); do
            if npm view "@perrylink/dsh-skill-pack-security-provider@${version}" version >/dev/null 2>&1; then
              echo "@perrylink/dsh-skill-pack-security-provider@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 15
          done
          echo "::warning::@perrylink/dsh-skill-pack-security-provider@${version} is still not visible on the registry after ~3 minutes (the publish step reported success; npm's read side is lagging)"

  release:
    needs: publish-provider
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout skill pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
